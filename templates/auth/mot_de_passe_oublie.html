{% extends 'base.html' %}
{% block title %}Mot de passe oublié — Limoud Hub{% endblock %}
{% block content %}
<div class="row justify-content-center" style="margin-top: 8vh;">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="mb-3">Mot de passe oublié</h5>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Votre email</label>
            <input type="email" class="form-control" name="email" required autofocus>
          </div>
          <button class="btn btn-limoud w-100">Envoyer le lien</button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('auth.login') }}" class="small">← Retour à la connexion</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
