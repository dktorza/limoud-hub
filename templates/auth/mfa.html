{% extends 'base.html' %}
{% block title %}Double authentification — Limoud Hub{% endblock %}
{% block content %}
<div class="row justify-content-center" style="margin-top: 8vh;">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="mb-3">🔐 Double authentification</h5>
        <p class="text-muted small">Saisissez le code de votre application d'authentification.</p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Code à 6 chiffres</label>
            <input type="text" class="form-control form-control-lg text-center"
                   name="code_totp" maxlength="6" pattern="\d{6}"
                   autocomplete="one-time-code" autofocus required>
          </div>
          <button class="btn btn-limoud w-100">Valider</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
