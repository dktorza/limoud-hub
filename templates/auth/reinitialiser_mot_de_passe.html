{% extends 'base.html' %}
{% block title %}Nouveau mot de passe — Limoud Hub{% endblock %}
{% block content %}
<div class="row justify-content-center" style="margin-top: 8vh;">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="mb-3">Nouveau mot de passe</h5>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Nouveau mot de passe</label>
            <input type="password" class="form-control" name="nouveau_mdp" required minlength="8">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmer</label>
            <input type="password" class="form-control" name="confirmation_mdp" required>
          </div>
          <button class="btn btn-limoud w-100">Enregistrer</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
