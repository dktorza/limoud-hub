{% extends 'base.html' %}
{% block title %}Nouvelle édition — Limoud Hub{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">Nouvelle édition</h4>
    <a href="{{ url_for('admin.editions_liste') }}" class="btn btn-outline-secondary">← Retour</a>
</div>
<div class="card">
    <div class="card-body p-4" style="max-width:600px">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Organisation</label>
                <select class="form-select" name="organisation_id" required>
                    {% for o in organisations %}
                    <option value="{{ o.id }}">{{ o.nom }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Nom</label>
                <input type="text" class="form-control" name="nom"
                       placeholder="Limoud Paris 2026" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Slug (identifiant unique)</label>
                <input type="text" class="form-control" name="slug"
                       placeholder="paris-2026" required>
                <div class="form-text">Minuscules, tirets, sans accents. Ex: paris-2026</div>
            </div>
            <div class="row">
                <div class="col mb-3">
                    <label class="form-label fw-semibold">Année</label>
                    <input type="number" class="form-control" name="annee" value="2026" required>
                </div>
                <div class="col mb-3">
                    <label class="form-label fw-semibold">Date début</label>
                    <input type="date" class="form-control" name="date_debut">
                </div>
                <div class="col mb-3">
                    <label class="form-label fw-semibold">Date fin</label>
                    <input type="date" class="form-control" name="date_fin">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Thème principal</label>
                <input type="text" class="form-control" name="theme_principal"
                       placeholder="Tikoun Olam">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Slug HelloAsso de l'organisation</label>
                <input type="text" class="form-control" name="ha_organisation_slug"
                       value="limoud-france">
            </div>
            <div class="row">
                <div class="col mb-3">
                    <label class="form-label fw-semibold">Couleur principale</label>
                    <input type="color" class="form-control form-control-color"
                           name="couleur_principale" value="#1a5276">
                </div>
                <div class="col mb-3">
                    <label class="form-label fw-semibold">Couleur secondaire</label>
                    <input type="color" class="form-control form-control-color"
                           name="couleur_secondaire" value="#e97132">
                </div>
            </div>
            <button type="submit" class="btn btn-limoud w-100">Créer l'édition</button>
        </form>
    </div>
</div>
{% endblock %}
